    <path d="M1480 420h12v-12h10v12h12v10h-12v12h-10v-12h-12z"/>
  </g>

  <!-- Test tube rack (left) -->
  <rect x="245" y="530" width="290" height="40" rx="12" fill="#005bb8"/>
  
    <rect x="288" y="300" width="44" height="245" rx="22" fill="#ffffff" stroke="#c7d9ea" stroke-width="5"/>
    <rect x="294" y="390" width="32" height="150" rx="16" fill="url(#red)"/>
    <rect x="283" y="282" width="54" height="34" rx="9" fill="#d40000"/>
    <rect x="368" y="300" width="44" height="245" rx="22" fill="#ffffff" stroke="#c7d9ea" stroke-width="5"/>
    <rect x="374" y="420" width="32" height="120" rx="16" fill="url(#red)"/>
    <rect x="363" y="282" width="54" height="34" rx="9" fill="#006ad6"/>
    <rect x="448" y="300" width="44" height="245" rx="22" fill="#ffffff" stroke="#c7d9ea" stroke-width="5"/>
    <rect x="454" y="400" width="32" height="140" rx="16" fill="url(#red)"/>
    <rect x="443" y="282" width="54" height="34" rx="9" fill="#2fb47a"/>
  <rect x="245" y="430" width="290" height="28" rx="10" fill="#1a7fe8" opacity="0.92"/>


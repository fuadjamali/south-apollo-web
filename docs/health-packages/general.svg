<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6fe"/><stop offset="1" stop-color="#d3e6f8"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a7fe8"/><stop offset="1" stop-color="#005bb8"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a5a"/><stop offset="1" stop-color="#d40000"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f47bab"/><stop offset="1" stop-color="#d63a78"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fa8dc"/><stop offset="1" stop-color="#1d4f80"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b4f96" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <clipPath id="avatar"><circle cx="800" cy="430" r="212"/></clipPath>
  </defs>
  
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="450" r="330" fill="#ffffff" opacity="0.7" filter="url(#soft)"/>
  <circle cx="200" cy="780" r="220" fill="#bcdcf6" opacity="0.6" filter="url(#soft)"/>
  <circle cx="1420" cy="140" r="200" fill="#ffffff" opacity="0.6" filter="url(#soft)"/>
  <g fill="#006ad6" opacity="0.18">
    <path d="M150 170h18v-18h16v18h18v16h-18v18h-16v-18h-18z"/>
    <path d="M1440 700h14v-14h12v14h14v12h-14v14h-12v-14h-14z"/>
    <path d="M560 110h12v-12h10v12h12v10h-12v12h-10v-12h-12z"/>

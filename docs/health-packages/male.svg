    <ellipse cx="722" cy="392" rx="13" ry="21" fill="#efbf95"/>
    <ellipse cx="878" cy="392" rx="13" ry="21" fill="#efbf95"/>
    <ellipse cx="800" cy="382" rx="80" ry="92" fill="#f6d2b0"/>

  <g filter="url(#shadow)"><circle cx="800" cy="430" r="232" fill="#ffffff"/></g>
  <circle cx="800" cy="430" r="212" fill="#d3e6f8"/>
  <g clip-path="url(#avatar)">
    
    <path d="M600 660 C600 555 690 505 800 505 C910 505 1000 555 1000 660 Z" fill="url(#blue)"/>
    <rect x="770" y="450" width="60" height="75" rx="10" fill="#efbf95"/>

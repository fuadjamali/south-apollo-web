  <rect x="696" y="392" width="100" height="12" rx="6" fill="#1f2d3a" opacity="0.7"/>
  <g fill="#dbe8f4">
    <rect x="694" y="420" width="28" height="26" rx="7"/><rect x="728" y="420" width="28" height="26" rx="7"/><rect x="762" y="420" width="28" height="26" rx="7"/><rect x="796" y="420" width="28" height="26" rx="7"/><rect x="830" y="420" width="28" height="26" rx="7"/><rect x="864" y="420" width="28" height="26" rx="7"/>
    <rect x="694" y="454" width="28" height="26" rx="7"/><rect x="728" y="454" width="28" height="26" rx="7"/><rect x="796" y="454" width="28" height="26" rx="7"/><rect x="830" y="454" width="28" height="26" rx="7"/><rect x="864" y="454" width="28" height="26" rx="7"/>
    <rect x="694" y="488" width="28" height="26" rx="7"/><rect x="728" y="488" width="28" height="26" rx="7"/><rect x="762" y="488" width="28" height="26" rx="7"/><rect x="796" y="488" width="28" height="26" rx="7"/><rect x="830" y="488" width="28" height="26" rx="7"/>
  </g>
  <rect x="762" y="454" width="28" height="26" rx="7" fill="#006ad6"/>
  <rect x="694" y="526" width="60" height="24" rx="12" fill="#ffffff" stroke="#c7d9ea" stroke-width="2"/>
  <rect x="762" y="526" width="60" height="24" rx="12" fill="#d40000"/>
  <rect x="830" y="526" width="60" height="24" rx="12" fill="#ffffff" stroke="#c7d9ea" stroke-width="2"/>

  <!-- Screen: confirm button -->
  <rect x="676" y="590" width="248" height="56" rx="28" fill="url(#btn)"/>
  <rect x="736" y="611" width="128" height="14" rx="7" fill="#ffffff"/>
  <rect x="716" y="672" width="168" height="10" rx="5" fill="#dbe8f4"/>
  <rect x="746" y="692" width="108" height="10" rx="5" fill="#dbe8f4"/>
  <rect x="760" y="770" width="80" height="8" rx="4" fill="#1f2d3a" opacity="0.25"/>

  <!-- Left card: symptom search -->
  <g filter="url(#shadow)">
    <rect x="200" y="210" width="300" height="180" rx="26" fill="#ffffff"/>
  </g>
  <circle cx="246" cy="258" r="16" fill="none" stroke="#006ad6" stroke-width="6"/>
  <path d="M258 270 L272 284" stroke="#006ad6" stroke-width="6" stroke-linecap="round"/>
  <rect x="290" y="248" width="176" height="16" rx="8" fill="#dbe8f4"/>
  <rect x="224" y="310" width="92" height="36" rx="18" fill="#fde7ea"/>
  <path d="M252 334 C240 325 242 316 249 316 C253 316 256 319 257 322 C258 319 261 316 265 316 C272 316 274 325 262 334 L257 338 Z" fill="#e84a5f"/>
  <rect x="270" y="322" width="36" height="10" rx="5" fill="#e84a5f" opacity="0.5"/>
  <rect x="326" y="310" width="96" height="36" rx="18" fill="#e3f1fb"/>
  <path d="M340 328 h10 l5 -9 l6 18 l5 -9 h10" stroke="#006ad6" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="384" y="322" width="28" height="10" rx="5" fill="#006ad6" opacity="0.4"/>
  <rect x="432" y="310" width="44" height="36" rx="18" fill="#e3f7ee"/>
  <circle cx="454" cy="328" r="7" fill="#2fb47a"/>


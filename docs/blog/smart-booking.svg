<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6fe"/>
      <stop offset="1" stop-color="#d3e6f8"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a7fe8"/>
      <stop offset="1" stop-color="#005bb8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b4f96" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="450" r="340" fill="#ffffff" opacity="0.7" filter="url(#soft)"/>
  <circle cx="1400" cy="780" r="220" fill="#bcdcf6" opacity="0.6" filter="url(#soft)"/>
  <circle cx="180" cy="140" r="200" fill="#ffffff" opacity="0.6" filter="url(#soft)"/>

  <!-- Faint connection lines -->
  <g stroke="#006ad6" stroke-width="3" stroke-dasharray="6 10" fill="none" opacity="0.25">
    <path d="M500 300 C 560 300, 580 330, 650 340"/>
    <path d="M950 330 C 1020 320, 1040 280, 1110 270"/>
    <path d="M950 610 C 1020 620, 1050 660, 1120 660"/>
    <path d="M650 620 C 590 630, 560 660, 500 660"/>
  </g>

  <!-- Phone -->
  <g filter="url(#shadow)">
    <rect x="640" y="80" width="320" height="740" rx="48" fill="#1f2d3a"/>
  </g>
  <rect x="656" y="96" width="288" height="708" rx="36" fill="#ffffff"/>
  <rect x="760" y="108" width="80" height="16" rx="8" fill="#1f2d3a"/>

  <!-- Screen: header -->
  <rect x="656" y="96" width="288" height="96" rx="36" fill="#006ad6"/>
  <rect x="656" y="150" width="288" height="42" fill="#006ad6"/>
  <rect x="680" y="146" width="140" height="14" rx="7" fill="#ffffff" opacity="0.95"/>
  <rect x="680" y="168" width="90" height="10" rx="5" fill="#ffffff" opacity="0.6"/>
  <circle cx="912" cy="160" r="14" fill="#ffffff" opacity="0.9"/>

  <!-- Screen: search -->
  <rect x="676" y="210" width="248" height="42" rx="21" fill="#eef4fb" stroke="#d7e5f3" stroke-width="2"/>
  <circle cx="700" cy="231" r="9" fill="none" stroke="#006ad6" stroke-width="4"/>
  <path d="M707 238 L714 245" stroke="#006ad6" stroke-width="4" stroke-linecap="round"/>
  <rect x="724" y="225" width="120" height="12" rx="6" fill="#c7d9ea"/>

  <!-- Screen: doctor card -->
  <rect x="676" y="268" width="248" height="92" rx="18" fill="#ffffff" stroke="#e1ecf6" stroke-width="2"/>
  <circle cx="720" cy="314" r="28" fill="#dbe9f7"/>
  <circle cx="720" cy="306" r="11" fill="#b9774b"/>
  <path d="M700 332 Q720 314 740 332 Z" fill="#006ad6"/>
  <path d="M709 300 Q720 286 731 300" stroke="#1c1411" stroke-width="7" fill="none" stroke-linecap="round"/>
  <rect x="762" y="296" width="120" height="12" rx="6" fill="#1f2d3a" opacity="0.8"/>
  <rect x="762" y="316" width="90" height="10" rx="5" fill="#c7d9ea"/>
  <g fill="#f5b942">
    <circle cx="768" cy="340" r="5"/><circle cx="782" cy="340" r="5"/><circle cx="796" cy="340" r="5"/><circle cx="810" cy="340" r="5"/><circle cx="824" cy="340" r="5"/>
  </g>


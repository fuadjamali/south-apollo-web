  <g filter="url(#shadow)">
    <rect x="240" y="560" width="260" height="150" rx="26" fill="#ffffff"/>
  </g>
  <path d="M310 600 C288 600 274 616 274 634 C274 658 310 684 310 684 C310 684 346 658 346 634 C346 616 332 600 310 600 Z" fill="#d40000"/>
  <circle cx="310" cy="634" r="12" fill="#ffffff"/>
  <rect x="366" y="610" width="110" height="14" rx="7" fill="#1f2d3a" opacity="0.7"/>
  <rect x="366" y="636" width="84" height="12" rx="6" fill="#dbe8f4"/>
  <rect x="366" y="658" width="100" height="12" rx="6" fill="#dbe8f4"/>

  <!-- Right card: appointment confirmed -->
  <g filter="url(#shadow)">
    <rect x="1100" y="200" width="300" height="150" rx="26" fill="#ffffff"/>
  </g>
  <circle cx="1160" cy="275" r="34" fill="#2fb47a"/>
  <path d="M1144 275l11 11 21-23" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1212" y="250" width="150" height="14" rx="7" fill="#1f2d3a" opacity="0.75"/>
  <rect x="1212" y="276" width="110" height="12" rx="6" fill="#dbe8f4"/>
  <rect x="1212" y="298" width="130" height="12" rx="6" fill="#dbe8f4"/>

  <!-- Right bottom: 24/7 clock -->
  <g filter="url(#shadow)">
    <circle cx="1210" cy="660" r="96" fill="#ffffff"/>
  </g>
  <circle cx="1210" cy="660" r="72" fill="none" stroke="#006ad6" stroke-width="10"/>
  <path d="M1210 660 V612 M1210 660 L1244 682" stroke="#005bb8" stroke-width="10" stroke-linecap="round"/>
  <circle cx="1210" cy="660" r="9" fill="#d40000"/>
  <path d="M1296 600 a100 100 0 0 1 10 60" stroke="#d40000" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M1298 652 l8 12 l10 -10" stroke="#d40000" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Decorative plus signs -->
  <g fill="#006ad6" opacity="0.18">
    <path d="M1470 150h18v-18h16v18h18v16h-18v18h-16v-18h-18z"/>
    <path d="M120 780h14v-14h12v14h14v12h-14v14h-12v-14h-14z"/>
    <path d="M560 800h12v-12h10v12h12v10h-12v12h-10v-12h-12z"/>
    <path d="M1040 110h12v-12h10v12h12v10h-12v12h-10v-12h-12z"/>
  </g>
</svg>

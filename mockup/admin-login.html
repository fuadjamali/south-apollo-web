<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Falcon App — Admin login mockup</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%23111827' fill-rule='evenodd'%3E%3Cpath d='M50,10 L85,20 L92,50 L80,80 L55,92 L40,92 L48,70 L35,66 L12,72 L25,56 L5,48 L25,38 L18,26 L32,18 Z M38,34 A6,6 0 1,1 37.99,34 Z'/%3E%3C/svg%3E" />
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: "class" };</script>
<script src="theme-toggle.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-950">

  <button onclick="toggleFalconTheme()"
          class="fixed right-6 top-6 rounded-full border border-gray-300 dark:border-gray-700 px-3 py-1.5 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-800">
    Toggle theme
  </button>

  <!-- COMPONENT: login-card (required) -->
  <main class="flex min-h-screen items-center justify-center px-6">
    <div class="w-full max-w-sm rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 p-8 shadow-sm">
      <svg viewBox="0 0 100 100" class="mx-auto h-10 w-10 text-gray-900 dark:text-white" fill="currentColor" fill-rule="evenodd" aria-hidden="true">
        <path d="M50,10 L85,20 L92,50 L80,80 L55,92 L40,92 L48,70 L35,66 L12,72 L25,56 L5,48 L25,38 L18,26 L32,18 Z M38,34 A6,6 0 1,1 37.99,34 Z"/>
      </svg>
      <h1 class="mt-3 text-center text-xl font-bold text-gray-900 dark:text-white">LOGIN_HEADING</h1>
      <p class="mt-1 text-center text-sm text-gray-500 dark:text-gray-400">LOGIN_SUBHEADING</p>

      <form class="mt-6 space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Email</label>
          <input type="email" placeholder="admin@example.com"
                 class="mt-1 w-full rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 px-3 py-2 text-sm text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:border-gray-500 dark:focus:border-gray-400 focus:outline-none" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Password</label>
          <input type="password" placeholder="••••••••"
                 class="mt-1 w-full rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 px-3 py-2 text-sm text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:border-gray-500 dark:focus:border-gray-400 focus:outline-none" />
        </div>

        <button type="button"
                class="w-full rounded-lg bg-gray-900 dark:bg-white py-2 text-sm font-semibold text-white dark:text-gray-900 hover:bg-gray-700 dark:hover:bg-gray-200">
          Sign in
        </button>
      </form>
    </div>
  </main>
  <!-- /COMPONENT: login-card -->

</body>
</html>

services:
  postgres:
    image: postgres:16-alpine
    container_name: falcon-web-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: falcon
      POSTGRES_PASSWORD: falcon
      POSTGRES_DB: falcon_web
    ports:
      - "5434:5432"
    volumes:
      - falcon-web-db-data:/var/lib/postgresql/data

volumes:
  falcon-web-db-data:
